<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
  <title>AGY Mobile // harjani.me</title>
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <style>
    :root {
      --term-font: 'Share Tech Mono', 'JetBrains Mono', monospace;
      --neon-cyan: #00ffcc;
      --dark-bg: #030712;
      --panel-bg: rgba(10, 15, 29, 0.96);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: var(--term-font) !important;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--dark-bg);
      color: var(--neon-cyan);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100vw;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0c1a2e 0%, #030712 80%);
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--panel-bg);
      border-bottom: 1px solid rgba(0, 255, 204, 0.25);
      user-select: none;
      flex-shrink: 0;
      z-index: 30;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.06);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-btn {
      background: rgba(0, 255, 204, 0.08);
      border: 1px solid rgba(0, 255, 204, 0.3);
      color: var(--neon-cyan);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .menu-btn:active {
      background: rgba(0, 255, 204, 0.25);
      transform: scale(0.95);
    }

    .menu-btn svg {
      width: 20px;
      height: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 15px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }

    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 255, 204, 0.25);
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 1px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    /* Terminal Viewport */
    #terminal-container {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: transparent;
      padding: 4px;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .xterm {
      height: 100%;
      width: 100%;
    }

    .xterm .xterm-viewport {
      overflow-y: scroll !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: pan-y !important;
      overscroll-behavior-y: contain !important;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 255, 204, 0.3) transparent;
    }

    .xterm-viewport::-webkit-scrollbar {
      width: 4px;
    }

    .xterm-viewport::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 204, 0.3);
      border-radius: 4px;
    }

    /* Bottom Control Area */
    #bottom-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0, 255, 204, 0.25);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 8px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      flex-shrink: 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
    }

    
    #attached-chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 4px 4px 4px;
      max-width: 100%;
    }
    .file-chip {
      background: rgba(0, 255, 204, 0.12);
      border: 1px solid rgba(0, 255, 204, 0.4);
      color: var(--neon-cyan);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .file-chip-remove {
      cursor: pointer;
      font-weight: bold;
      color: #f87171;
    }

    .chat-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 12px;
      padding: 3px 6px 3px 10px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 255, 204, 0.08);
      transition: all 0.15s ease;
    }

    .chat-input-wrapper:focus-within {
      border-color: var(--neon-cyan);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 14px rgba(0, 255, 204, 0.4);
    }

    .plus-file-btn {
      appearance: none;
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid rgba(0, 255, 204, 0.35);
      color: var(--neon-cyan);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .plus-file-btn:active {
      transform: scale(0.92);
      background: var(--neon-cyan);
      color: #030712;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .plus-file-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .prompt-prefix {
      color: var(--neon-cyan);
      font-weight: 700;
      font-size: 15px;
      user-select: none;
      text-shadow: 0 0 6px rgba(0, 255, 204, 0.6);
    }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f5f9;
      font-size: 15px;
      line-height: 20px;
      padding: 4px 0;
      min-width: 0;
      resize: none;
      height: 28px;
      max-height: 90px;
      overflow-y: auto;
      letter-spacing: 0.5px;
    }

    .terminal-input::placeholder {
      color: #475569;
      font-size: 13.5px;
    }

    .send-btn {
      appearance: none;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0284c7 100%);
      border: none;
      color: #030712;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }

    .send-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.8);
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5;
    }

    /* Big Glowing Directional Navigation Buttons */
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .big-nav-btn {
      appearance: none;
      border: 1px solid rgba(0, 255, 204, 0.3);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
      color: var(--neon-cyan);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      touch-action: manipulation;
      transition: all 0.12s;
    }

    .big-nav-btn:active {
      transform: translateY(2px);
      background: rgba(0, 255, 204, 0.22);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.6);
      color: #ffffff;
    }

    .big-nav-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.5;
    }

    /* Accessory Terminal Keys */
    .quick-keys-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-keys-row::-webkit-scrollbar {
      display: none;
    }

    .key-btn {
      flex: 1 0 auto;
      min-width: 42px;
      height: 32px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.2);
      color: #94a3b8;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.1s;
    }

    
    .key-btn.latched {
      background: var(--neon-cyan) !important;
      color: #030712 !important;
      border-color: var(--neon-cyan) !important;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .key-btn:active {
      background: rgba(0, 255, 204, 0.25);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .file-notification {
      font-size: 11px;
      color: var(--neon-cyan);
      display: none;
      padding-left: 6px;
      text-shadow: 0 0 6px rgba(0, 255, 204, 0.6);
    }

    /* Sidebar Drawer */
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(4px);
      z-index: 998;
      display: none;
    }

    #sidebar-overlay.open {
      display: block;
    }

    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 82%;
      max-width: 320px;
      background: #090e1a;
      border-right: 1px solid rgba(0, 255, 204, 0.25);
      z-index: 999;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
    }

    #sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.7);
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .new-chat-btn {
      appearance: none;
      border: 1px solid var(--neon-cyan);
      background: rgba(0, 255, 204, 0.15);
      color: var(--neon-cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .new-chat-btn:active {
      background: var(--neon-cyan);
      color: #030712;
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    
    .conv-category-tag {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .tag-GOAL { background: rgba(245, 158, 11, 0.2); color: var(--neon-amber); border: 1px solid var(--neon-amber); }
    .tag-DEBUG { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }
    .tag-FEATURE { background: rgba(0, 255, 204, 0.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .tag-PLAN { background: rgba(56, 189, 248, 0.2); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
    .tag-RESEARCH { background: rgba(236, 72, 153, 0.2); color: var(--neon-magenta); border: 1px solid var(--neon-magenta); }
    .tag-CLI { background: rgba(148, 163, 184, 0.2); color: #94a3b8; border: 1px solid #94a3b8; }

    .conv-item {
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 255, 204, 0.1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .conv-item:active {
      border-color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.15);
    }

    .conv-item.active {
      border-color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.15);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    .conv-title {
      font-size: 13px;
      color: #f1f5f9;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-time-meta {
      font-size: 10.5px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    .conv-meta {
      font-size: 11px;
      color: #64748b;
    }

    /* Security Key Modal */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(12px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 340px;
      background: #090e1a;
      border: 1px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .auth-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .auth-input {
      width: 100%;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
    }

    .auth-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .auth-btn {
      appearance: none;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0284c7 100%);
      border: none;
      color: #030712;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .auth-btn:active {
      transform: scale(0.97);
    }

    .auth-error {
      color: #ef4444;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Security Key Verification Screen -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-title">🔐 ACCESS KEY</div>
      <div style="font-size: 12px; color: #94a3b8;">Enter security key to access Antigravity:</div>
      <input type="password" id="key-input" class="auth-input" placeholder="••••••" maxlength="12" autofocus>
      <div id="auth-error" class="auth-error">Invalid security key. Try again.</div>
      <button class="auth-btn" id="btn-unlock">UNLOCK</button>
    </div>
  </div>

  <div id="sidebar-overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>⚡ SESSIONS</span>
      </div>
      <button class="new-chat-btn" id="btn-new-chat">+ NEW</button>
    </div>
    <div class="conv-list" id="conv-list">
      <div style="color: #64748b; font-size: 12px; padding: 10px;">Reading neural logs...</div>
    </div>
  </aside>

  <div id="app-container">
    <header>
      <div class="header-left">
        <button class="menu-btn" id="btn-menu" aria-label="Open Chats Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand">
          <span>ANTIGRAVITY</span>
          <span style="color: #38bdf8;" id="header-title">// CLI</span>
        </div>
      </div>
      <div class="status-badge" id="status-indicator">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>
    </header>

    <div id="terminal-container"></div>

    <div id="bottom-panel">
      <div id="file-note" class="file-notification"></div>

            <!-- Attached Multi-Files Strip -->
      <div id="attached-chips-row"></div>
      <!-- Cyber Terminal Prompt Bar -->
      <div class="chat-input-wrapper">
        <input type="file" id="file-picker" style="display: none;" multiple>
        <button class="plus-file-btn" id="btn-plus" title="Add file" aria-label="Add file">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <span class="prompt-prefix">❯</span>

        <textarea 
          id="chat-input" 
          class="terminal-input" 
          placeholder="Ask Antigravity or type command..." 
          rows="1"
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
          name="terminal_query_field"
          data-form-type="other"
          data-lpignore="true"
        ></textarea>

        <button class="send-btn" id="btn-send" title="Send" aria-label="Send">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>

      <!-- Large Navigation Buttons -->
      <div class="nav-row">
        <button class="big-nav-btn" id="btn-arrow-up" aria-label="Arrow Up">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path>
          </svg>
          <span>UP</span>
        </button>
        <button class="big-nav-btn" id="btn-arrow-down" aria-label="Arrow Down">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
          </svg>
          <span>DOWN</span>
        </button>
      </div>

      <!-- Accessory Terminal Keys -->
            <div class="quick-keys-row">
        <button class="key-btn" id="btn-ctrl">CTRL</button>
        <button class="key-btn" id="btn-shift">SHIFT</button>
        <button class="key-btn" id="btn-tab">TAB</button>
        <button class="key-btn" id="btn-esc">ESC</button>
        <button class="key-btn" id="btn-clear">CLEAR</button>
      </div>
      <!-- Legacy buttons row -->
      <div class="quick-keys-row" style="display:none;">
        <button class="key-btn" id="btn-esc">ESC</button>
        <button class="key-btn" id="btn-tab">TAB</button>
        <button class="key-btn" id="btn-ctrl-c">CTRL+C</button>
        <button class="key-btn" id="btn-left">◀</button>
        <button class="key-btn" id="btn-right">▶</button>
        <button class="key-btn" id="btn-bottom">BOTTOM</button>
        <button class="key-btn" id="btn-clear">CLEAR</button>
      </div>
    </div>
  </div>

  <script>
    let term;
    let fitAddon;
    let ws;
    let currentConvId = null;
    let authToken = localStorage.getItem('agy_key') || '';

    const appContainer = document.getElementById('app-container');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const termContainer = document.getElementById('terminal-container');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const btnPlus = document.getElementById('btn-plus');
    const filePicker = document.getElementById('file-picker');
    const fileNote = document.getElementById('file-note');
    const btnMenu = document.getElementById('btn-menu');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const convList = document.getElementById('conv-list');
    const btnNewChat = document.getElementById('btn-new-chat');
    const headerTitle = document.getElementById('header-title');
    const authOverlay = document.getElementById('auth-overlay');
    const keyInput = document.getElementById('key-input');
    const btnUnlock = document.getElementById('btn-unlock');
    const authError = document.getElementById('auth-error');

    function checkAuth() {
      if (authToken) {
        authOverlay.style.display = 'none';
        initTerminal();
        connectWS();
      } else {
        authOverlay.style.display = 'flex';
        keyInput.focus();
      }
    }

    async function verifyKey() {
      const entered = keyInput.value.trim();
      const res = await fetch(`/api/conversations?token=${encodeURIComponent(entered)}`);
      if (res.ok) {
        authToken = entered;
        localStorage.setItem('agy_key', entered);
        authOverlay.style.display = 'none';
        initTerminal();
        connectWS();
      } else {
        authError.style.display = 'block';
        keyInput.value = '';
        keyInput.focus();
      }
    }

    btnUnlock.addEventListener('click', verifyKey);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyKey();
    });

    function adjustViewport() {
      if (window.visualViewport) {
        appContainer.style.height = `${window.visualViewport.height}px`;
        appContainer.style.top = `${window.visualViewport.offsetTop}px`;
      } else {
        appContainer.style.height = `${window.innerHeight}px`;
      }
      if (fitAddon) fitAddon.fit();
      notifyResize();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', adjustViewport);
    } else {
      window.addEventListener('resize', adjustViewport);
    }

    function initTerminal() {
      if (term) return;
      term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'underline',
        cursorWidth: 3,
        fontSize: 13,
        fontFamily: '"Share Tech Mono", "JetBrains Mono", monospace',
        scrollback: 1000,
        scrollSensitivity: 1,
        theme: {
          background: '#030712',
          foreground: '#e2e8f0',
          cursor: '#00ffcc',
          selectionBackground: 'rgba(0, 255, 204, 0.3)',
          black: '#0f172a',
          red: '#f87171',
          green: '#00ffcc',
          yellow: '#facc15',
          blue: '#38bdf8',
          magenta: '#c084fc',
          cyan: '#22d3ee',
          white: '#f8fafc',
          brightBlack: '#475569',
          brightRed: '#ef4444',
          brightGreen: '#4ade80',
          brightYellow: '#fbbf24',
          brightBlue: '#60a5fa',
          brightMagenta: '#e879f9',
          brightCyan: '#67e8f9',
          brightWhite: '#ffffff'
        },
        convertEol: true,
        allowProposedApi: true
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(new WebLinksAddon.WebLinksAddon());

      term.open(termContainer);
      fitAddon.fit();

      // Only forward hardware keyboard when terminal itself is focused
      term.onData(data => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'input', data: data }));
      });
    }

    function sendTermInput(str) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', data: str }));
      }
    }

    function notifyResize() {
      if (!term || !fitAddon) return;
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows
        }));
      }
    }

    let reconnectTimer = null;
    let pingInterval = null;
    let isReconnecting = false;

    function connectWS(conversationId = null) {
      if (!authToken) return;

      if (conversationId !== null && conversationId !== currentConvId) {
        currentConvId = conversationId;
        if (term) term.clear();
      }

      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }

      if (ws) {
        ws.onclose = null;
        ws.onerror = null;
        try { ws.close(); } catch(e) {}
      }

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      let url;
      if (location.port === '8080') {
        url = `${proto}//${location.hostname}:8081?token=${authToken}`;
      } else {
        url = `${proto}//${location.host}/ws?token=${authToken}`;
      }
      if (currentConvId) {
        url += `&conversation=${currentConvId}`;
      }

      ws = new WebSocket(url);

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'ONLINE';
        isReconnecting = false;
        notifyResize();

        // 10-second client-side heartbeat to keep Cloudflare tunnel and socket alive
        pingInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'ping' }));
          }
        }, 10000);
      };

      let buffer = '';
      let timer = null;

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'output' || msg.type === 'history') {
            buffer += msg.data;
            if (!timer) {
              timer = setTimeout(() => {
                term.write(buffer);
                buffer = '';
                timer = null;
              }, 16);
            }
          }
        } catch (e) {
          term.write(event.data);
        }
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'RECONNECTING...';
        if (pingInterval) clearInterval(pingInterval);

        // Instant seamless exponential auto-reconnect without clearing terminal or dropping execution
        if (!isReconnecting) {
          isReconnecting = true;
          reconnectTimer = setTimeout(() => {
            connectWS(currentConvId);
          }, 1500);
        }
      };

      ws.onerror = () => {
        try { ws.close(); } catch(e) {}
      };
    }

    // Reconnect immediately if browser tab gains focus or user returns to screen
    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          connectWS(currentConvId);
        }
      }
    });

    window.addEventListener('online', () => {
      connectWS(currentConvId);
    });

    // Clean textarea input without glitching per-keystroke PTY echoes
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + 'px';
    });

    function handleSend() {
      const val = chatInput.value;
      if (!val && val !== '') return;
      sendTermInput(val + '\r');
      chatInput.value = '';
      chatInput.style.height = '28px';
      term.scrollToBottom();
    }

    btnSend.addEventListener('click', (e) => {
      e.preventDefault();
      handleSend();
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    btnPlus.addEventListener('click', (e) => {
      e.preventDefault();
      filePicker.click();
    });

    filePicker.addEventListener('change', async () => {
      if (!filePicker.files || filePicker.files.length === 0) return;
      const formData = new FormData();
      for (const file of filePicker.files) {
        formData.append('files', file);
      }
      fileNote.style.display = 'block';
      fileNote.textContent = 'Transferring file payload...';

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success && data.files.length > 0) {
          fileNote.textContent = `Attached: ${data.files.map(f => f.split('/').pop()).join(', ')}`;
          const filePaths = data.files.join(' ');
          chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + filePaths;
          chatInput.focus();
        } else {
          fileNote.textContent = 'Upload failed';
        }
      } catch (err) {
        fileNote.textContent = 'Error uploading file';
      }

      setTimeout(() => { fileNote.style.display = 'none'; }, 4000);
      filePicker.value = '';
    });

    function openMenu() {
      sidebar.classList.add('open');
      sidebarOverlay.classList.add('open');
      loadConversations();
    }

    function closeMenu() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    }

    btnMenu.addEventListener('click', openMenu);
    sidebarOverlay.addEventListener('click', closeMenu);

    btnNewChat.addEventListener('click', () => {
      closeMenu();
      headerTitle.textContent = '// CLI';
      chatInput.value = '';
      connectWS(null);
    });

    async function loadConversations() {
      try {
        const res = await fetch(`/api/conversations?token=${authToken}`);
        const list = await res.json();
        if (!list || list.length === 0) {
          convList.innerHTML = '<div style="color:#64748b;padding:10px;font-size:12px;">No sessions recorded</div>';
          return;
        }
        convList.innerHTML = '';
        list.forEach(c => {
          const item = document.createElement('div');
          item.className = 'conv-item' + (currentConvId === c.id ? ' active' : '');
          const dateStr = new Date(c.mtime * 1000).toLocaleString(undefined, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          item.innerHTML = `
            <div class="conv-item-top">
            <span class="conv-category-tag tag-${c.category || "CLI"}">${c.category || "CLI"}</span>
            <div class="conv-title">${c.title}</div>
          </div>
            <div class="conv-time-meta">
            <span>${dateStr}</span>
            <span class="exact-time">${c.formatted_time || ""}</span>
          </div>
          `;
          item.addEventListener('click', () => {
            closeMenu();
            headerTitle.textContent = '// ' + c.id.substring(0, 8);
            chatInput.value = '';
            connectWS(c.id);
          });
          convList.appendChild(item);
        });
      } catch (e) {
        convList.innerHTML = '<div style="color:#f87171;padding:10px;font-size:12px;">Error retrieving logs</div>';
      }
    }

    document.getElementById('btn-arrow-up').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x1b[A');
    });

    document.getElementById('btn-arrow-down').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x1b[B');
    });

    document.getElementById('btn-left').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x1b[D');
    });

    document.getElementById('btn-right').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x1b[C');
    });

    document.getElementById('btn-esc').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x1b');
    });

    document.getElementById('btn-tab').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\t');
    });

    document.getElementById('btn-ctrl-c').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x03');
      chatInput.value = '';
    });

    document.getElementById('btn-bottom').addEventListener('click', (e) => {
      e.preventDefault();
      term.scrollToBottom();
    });

    document.getElementById('btn-clear').addEventListener('click', (e) => {
      e.preventDefault();
      sendTermInput('\x0c');
      chatInput.value = '';
    });

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      adjustViewport();
      setTimeout(adjustViewport, 200);
    });
  </script>
</body>
</html>

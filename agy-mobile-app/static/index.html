<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
  <title>AGY Mobile 2.0 // Autonomous Command Center</title>
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <style>
    :root {
      --term-font: 'Share Tech Mono', 'JetBrains Mono', monospace;
      --neon-cyan: #00ffcc;
      --neon-blue: #38bdf8;
      --neon-magenta: #ec4899;
      --neon-amber: #f59e0b;
      --neon-green: #10b981;
      --dark-bg: #030712;
      --panel-bg: rgba(10, 15, 29, 0.96);
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(0, 255, 204, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: var(--term-font) !important;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--dark-bg);
      color: var(--neon-cyan);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100vw;
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0c1a2e 0%, #030712 80%);
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-subtle);
      user-select: none;
      flex-shrink: 0;
      z-index: 40;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.06);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(0, 255, 204, 0.08);
      border: 1px solid rgba(0, 255, 204, 0.3);
      color: var(--neon-cyan);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      gap: 4px;
      transition: all 0.15s;
    }

    .icon-btn:active {
      background: rgba(0, 255, 204, 0.25);
      transform: scale(0.95);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 14px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 255, 204, 0.25);
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 1px;
    }

    .status-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .status-badge .dot.connected {
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    /* 1-Tap Quick Action Bar 2.0 Deck */
    #quick-action-bar {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(8, 14, 26, 0.98);
      border-bottom: 1px solid rgba(0, 255, 204, 0.18);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      z-index: 35;
    }

    #quick-action-bar::-webkit-scrollbar {
      display: none;
    }

    .q-action-chip {
      flex: 0 0 auto;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(0, 255, 204, 0.3);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 5px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.12s;
    }

    .q-action-chip:active {
      transform: scale(0.94);
      border-color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.2);
    }

    .q-action-chip.accent-goal { border-color: var(--neon-amber); color: var(--neon-amber); }
    .q-action-chip.accent-swarm { border-color: var(--neon-blue); color: var(--neon-blue); }
    .q-action-chip.accent-agents { border-color: var(--neon-green); color: var(--neon-green); }
    .q-action-chip.accent-sandbox { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .q-action-chip.accent-compact { border-color: #a855f7; color: #c084fc; }
    .q-action-chip.accent-halt { border-color: #ef4444; color: #ef4444; }

    /* Main Workspace Row (Terminal + Right Flowchart Sidebar) */
    #workspace-row {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    #terminal-container {
      flex: 1;
      height: 100%;
      width: 100%;
      padding: 4px;
      position: relative;
    }

    .xterm {
      height: 100%;
      width: 100%;
    }

    .xterm .xterm-viewport {
      overflow-y: scroll !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: pan-y !important;
      overscroll-behavior-y: contain !important;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 255, 204, 0.3) transparent;
    }

    /* Right Sidebar: Live Execution Flowchart */
    #flowchart-sidebar {
      width: 320px;
      background: rgba(8, 14, 26, 0.98);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 38;
      box-shadow: -6px 0 20px rgba(0,0,0,0.7);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 860px) {
      #flowchart-sidebar {
        position: fixed;
        top: 0; bottom: 0; right: 0;
        width: 85%;
        max-width: 360px;
        transform: translateX(100%);
        z-index: 999;
      }
      #flowchart-sidebar.open {
        transform: translateX(0);
      }
    }

    .flowchart-header {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
    }

    .flowchart-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flowchart-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .flow-node {
      background: var(--card-bg);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.15s;
    }

    .flow-node::before {
      content: '';
      position: absolute;
      left: 14px;
      bottom: -10px;
      width: 2px;
      height: 10px;
      background: rgba(0, 255, 204, 0.3);
    }

    .flow-node:last-child::before {
      display: none;
    }

    .flow-node-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
      letter-spacing: 0.8px;
    }

    .badge-intent { background: rgba(56, 189, 248, 0.2); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
    .badge-tool { background: rgba(0, 255, 204, 0.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .badge-step { background: rgba(236, 72, 153, 0.2); color: var(--neon-magenta); border: 1px solid var(--neon-magenta); }

    .flow-node-label {
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
      word-break: break-word;
    }

    .flow-node-details {
      font-size: 10.5px;
      color: #94a3b8;
      background: rgba(3, 7, 18, 0.7);
      padding: 6px;
      border-radius: 4px;
      font-family: monospace !important;
      max-height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Bottom Control Panel & Command Bar */
    #bottom-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 8px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 36;
      flex-shrink: 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
    }

    /* File upload chips strip */
    #attached-chips-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    #attached-chips-row::-webkit-scrollbar { display: none; }

    .file-chip {
      background: rgba(0, 255, 204, 0.12);
      border: 1px solid rgba(0, 255, 204, 0.4);
      color: var(--neon-cyan);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .file-chip-remove {
      cursor: pointer;
      font-weight: bold;
      color: #f87171;
    }

    .chat-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(3, 7, 18, 0.95);
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 12px;
      padding: 3px 6px 3px 10px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 255, 204, 0.08);
      transition: all 0.15s ease;
    }

    .chat-input-wrapper:focus-within {
      border-color: var(--neon-cyan);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 14px rgba(0, 255, 204, 0.4);
    }

    .round-btn {
      appearance: none;
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid rgba(0, 255, 204, 0.35);
      color: var(--neon-cyan);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .round-btn:active {
      transform: scale(0.92);
      background: var(--neon-cyan);
      color: #030712;
    }

    .round-btn.recording {
      background: #ef4444 !important;
      color: white !important;
      border-color: #ef4444 !important;
      animation: pulse-mic 1s infinite alternate;
    }

    @keyframes pulse-mic {
      from { box-shadow: 0 0 4px #ef4444; }
      to { box-shadow: 0 0 16px #ef4444; }
    }

    .round-btn svg { width: 17px; height: 17px; }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f5f9;
      font-size: 14.5px;
      line-height: 20px;
      padding: 4px 0;
      min-width: 0;
      resize: none;
      height: 28px;
      max-height: 90px;
      overflow-y: auto;
      letter-spacing: 0.5px;
    }

    .terminal-input::placeholder {
      color: #475569;
      font-size: 13px;
    }

    .send-btn {
      appearance: none;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0284c7 100%);
      border: none;
      color: #030712;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }

    .send-btn:active { transform: scale(0.92); }
    .send-btn svg { width: 16px; height: 16px; stroke-width: 2.5; }

    /* Virtual Modifier Keys & Access Keys Row */
    .quick-keys-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-keys-row::-webkit-scrollbar { display: none; }

    .key-btn {
      flex: 1 0 auto;
      min-width: 44px;
      height: 32px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.2);
      color: #94a3b8;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 0 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.1s;
    }

    .key-btn:active {
      background: rgba(0, 255, 204, 0.25);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* Sticky modifier active state */
    .key-btn.latched {
      background: var(--neon-cyan) !important;
      color: #030712 !important;
      border-color: var(--neon-cyan) !important;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* Directional Buttons */
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .big-nav-btn {
      appearance: none;
      border: 1px solid rgba(0, 255, 204, 0.28);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
      color: var(--neon-cyan);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1.5px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.12s;
    }

    .big-nav-btn:active {
      transform: translateY(1px);
      background: rgba(0, 255, 204, 0.22);
      color: #ffffff;
    }

    .big-nav-btn svg { width: 18px; height: 18px; }

    /* Left Sidebar: Sessions Drawer */
    #sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(4px);
      z-index: 998;
      display: none;
    }
    #sidebar-overlay.open { display: block; }

    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 82%; max-width: 340px;
      background: #090e1a;
      border-right: 1px solid var(--border-subtle);
      z-index: 999;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.7);
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    .new-chat-btn {
      appearance: none;
      border: 1px solid var(--neon-cyan);
      background: rgba(0, 255, 204, 0.15);
      color: var(--neon-cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .conv-item {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.12);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.12s;
    }

    .conv-item.active {
      border-color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.15);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    .conv-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .conv-category-tag {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .tag-GOAL { background: rgba(245, 158, 11, 0.2); color: var(--neon-amber); border: 1px solid var(--neon-amber); }
    .tag-DEBUG { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }
    .tag-FEATURE { background: rgba(0, 255, 204, 0.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .tag-PLAN { background: rgba(56, 189, 248, 0.2); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
    .tag-RESEARCH { background: rgba(236, 72, 153, 0.2); color: var(--neon-magenta); border: 1px solid var(--neon-magenta); }
    .tag-CLI { background: rgba(148, 163, 184, 0.2); color: #94a3b8; border: 1px solid #94a3b8; }

    .conv-title {
      font-size: 13px;
      color: #f1f5f9;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .conv-time-meta {
      font-size: 10.5px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    /* Telemetry Modal */
    #telemetry-modal {
      position: fixed; inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #telemetry-modal.open { display: flex; }

    .telemetry-card {
      width: 100%; max-width: 420px;
      background: #090e1a;
      border: 1px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 204, 0.2);
      padding-bottom: 10px;
    }

    .agent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 204, 0.1);
      font-size: 12px;
    }

    /* Security Key Screen */
    #auth-overlay {
      position: fixed; inset: 0;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(12px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%; max-width: 340px;
      background: #090e1a;
      border: 1px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .auth-input {
      width: 100%;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
    }

    .auth-btn {
      appearance: none;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, #0284c7 100%);
      border: none;
      color: #030712;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Key Unlock Overlay -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div style="font-size: 16px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 2px;">🔐 ACCESS KEY</div>

  <!-- Left Sidebar: Sessions Drawer -->
  <div id="sidebar-overlay"></div>

    <div class="sidebar-header">

  <!-- Agent Directory & Telemetry Popover Modal -->

        <!-- Populated dynamically -->
      </div>

  </div>

  <!-- Main App Layout -->
  <div id="app-container">
    <header>
      <div class="header-left">
        <button class="icon-btn" id="btn-menu" aria-label="Open Chats Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand">
          <span>AGY</span>
          <span style="color: var(--neon-blue);" id="header-title">// COCKPIT 2.0</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btn-toggle-flowchart" title="Toggle Live Flowchart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>FLOW</span>
        </button>
        <div class="status-badge" id="status-indicator">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">OFFLINE</span>
        </div>
      </div>
    </header>

    <!-- 1-Tap Quick Action Bar 2.0 -->
    <div id="quick-action-bar">
      <button class="q-action-chip accent-goal" id="q-goal">⚡ Goal Mode</button>
      <button class="q-action-chip accent-swarm" id="q-swarm">👥 Teamwork Swarm</button>
      <button class="q-action-chip accent-agents" id="q-agents">📊 Agent Directory</button>
      <button class="q-action-chip accent-research" id="q-research">🔬 Deep Research</button>
      <button class="q-action-chip accent-sandbox" id="q-sandbox">🧪 Code Sandbox</button>
      <button class="q-action-chip accent-compact" id="q-compact">🧹 Compact</button>
      <button class="q-action-chip accent-halt" id="q-halt">🛑 Emergency Halt</button>
    </div>

    <!-- Main Workspace (Terminal + Live Execution Flowchart) -->
    <div id="workspace-row">
      <div id="terminal-container"></div>

      <!-- Live Execution Flowchart Right Sidebar -->
      <aside id="flowchart-sidebar">
        <div class="flowchart-header">
          <div class="flowchart-title">
            <span>⚡ LIVE EXECUTION FLOW</span>
          </div>
          <button id="btn-close-flowchart" class="icon-btn" style="padding: 2px 6px;">✕</button>
        </div>
        <div class="flowchart-scroll" id="flowchart-container">
          <div style="color: #64748b; font-size: 11px; padding: 12px;">Waiting for execution stream...</div>
        </div>
      </aside>
    </div>

    <!-- Bottom Input & Virtual Key Panel -->
    <div id="bottom-panel">
      <!-- Attached Multi-Files Strip -->
      <div id="attached-chips-row"></div>

      <!-- Cyber Terminal Prompt Bar -->
      <div class="chat-input-wrapper">
        <input type="file" id="file-picker" style="display: none;" multiple>
        <button class="round-btn" id="btn-plus" title="Add files (multi-select)">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button class="round-btn" id="btn-mic" title="Voice Input (HTML5 Recording)">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <span style="color: var(--neon-cyan); font-weight: 700; font-size: 14px;">❯</span>

        <textarea 
          id="chat-input" 
          class="terminal-input" 
          placeholder="Ask Antigravity or type command..." 
          rows="1"
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
        ></textarea>

        <button class="send-btn" id="btn-send" title="Send">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>

      <!-- Large Up / Down Navigation -->
      <div class="nav-row">
        <button class="big-nav-btn" id="btn-arrow-up">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path></svg>
          <span>UP</span>
        </button>
        <button class="big-nav-btn" id="btn-arrow-down">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
          <span>DOWN</span>
        </button>
      </div>

      <!-- Virtual Modifier Keys + Accessory Row (Combinable with physical keyboard) -->
      <div class="quick-keys-row">
        <button class="key-btn" id="btn-mod-ctrl">CTRL</button>
        <button class="key-btn" id="btn-mod-shift">SHIFT</button>
        <button class="key-btn" id="btn-mod-tab">TAB</button>
        <button class="key-btn" id="btn-esc">ESC</button>
        <button class="key-btn" id="btn-left">◀</button>
        <button class="key-btn" id="btn-right">▶</button>
        <button class="key-btn" id="btn-clear">CLEAR</button>
      </div>
    </div>
  </div>

  <script>
    let term;
    let fitAddon;
    let ws;
    let currentConvId = null;
    let authToken = localStorage.getItem('agy_key') || '';

    // Virtual Modifier States (Combine with hardware keyboard input)
    let modifierState = {
      ctrl: false,
      shift: false,
      tab: false
    };

    // Voice Recorder State
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Attached files queue
    let attachedFiles = [];

    // DOM Elements
    const appContainer = document.getElementById('app-container');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const termContainer = document.getElementById('terminal-container');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const btnPlus = document.getElementById('btn-plus');
    const btnMic = document.getElementById('btn-mic');
    const filePicker = document.getElementById('file-picker');
    const attachedChipsRow = document.getElementById('attached-chips-row');
    const btnMenu = document.getElementById('btn-menu');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const convList = document.getElementById('conv-list');
    const btnNewChat = document.getElementById('btn-new-chat');
    const headerTitle = document.getElementById('header-title');
    const authOverlay = document.getElementById('auth-overlay');
    const keyInput = document.getElementById('key-input');
    const btnUnlock = document.getElementById('btn-unlock');
    const authError = document.getElementById('auth-error');

    const flowchartSidebar = document.getElementById('flowchart-sidebar');
    const btnToggleFlowchart = document.getElementById('btn-toggle-flowchart');
    const btnCloseFlowchart = document.getElementById('btn-close-flowchart');
    const flowchartContainer = document.getElementById('flowchart-container');

    const telemetryModal = document.getElementById('telemetry-modal');
    const btnCloseTelemetry = document.getElementById('btn-close-telemetry');
    const telemetryContent = document.getElementById('telemetry-content');

    const btnModCtrl = document.getElementById('btn-mod-ctrl');
    const btnModShift = document.getElementById('btn-mod-shift');
    const btnModTab = document.getElementById('btn-mod-tab');

    // Authentication
    function checkAuth() {
      if (authToken) {
        authOverlay.style.display = 'none';
        initTerminal();
        connectWS();
        startFlowchartPolling();
      } else {
        authOverlay.style.display = 'flex';
        keyInput.focus();
      }
    }

    async function verifyKey() {
      const entered = keyInput.value.trim();
      const res = await fetch(`/api/conversations?token=${encodeURIComponent(entered)}`);
      if (res.ok) {
        authToken = entered;
        localStorage.setItem('agy_key', entered);
        authOverlay.style.display = 'none';
        initTerminal();
        connectWS();
        startFlowchartPolling();
      } else {
        authError.style.display = 'block';
        keyInput.value = '';
        keyInput.focus();
      }
    }

    btnUnlock.addEventListener('click', verifyKey);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyKey();
    });

    // Viewport adjustment
    function adjustViewport() {
      if (window.visualViewport) {
        appContainer.style.height = `${window.visualViewport.height}px`;
      } else {
        appContainer.style.height = `${window.innerHeight}px`;
      }
      if (fitAddon) fitAddon.fit();
    }
    window.visualViewport?.addEventListener('resize', adjustViewport);
    window.addEventListener('resize', adjustViewport);

    // Terminal Initialization with Modifier Combo Interceptor
    function initTerminal() {
      if (term) return;

      term = new Terminal({
        fontFamily: "'Share Tech Mono', 'JetBrains Mono', monospace",
        fontSize: 14,
        lineHeight: 1.25,
        cursorBlink: true,
        cursorStyle: 'block',
        theme: {
          background: '#030712',
          foreground: '#f1f5f9',
          cursor: '#00ffcc',
          selectionBackground: 'rgba(0, 255, 204, 0.35)',
          black: '#030712',
          red: '#ef4444',
          green: '#10b981',
          yellow: '#f59e0b',
          blue: '#38bdf8',
          magenta: '#ec4899',
          cyan: '#00ffcc',
          white: '#f8fafc',
          brightBlack: '#475569',
          brightCyan: '#38bdf8'
        },
        convertEol: true,
        scrollback: 5000,
        allowTransparency: true
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(new WebLinksAddon.WebLinksAddon());
      term.open(termContainer);
      fitAddon.fit();

      // Hardware keyboard + Virtual Modifier combination hook
      term.attachCustomKeyEventHandler((e) => {
        if (e.type === 'keydown') {
          // If virtual CTRL is active
          if (modifierState.ctrl) {
            const k = e.key.toLowerCase();
            if (k.length === 1 && k >= 'a' && k <= 'z') {
              const asciiCode = k.charCodeAt(0) - 96; // 1 for a, 3 for c
              sendTermInput(String.fromCharCode(asciiCode));
              setModifier('ctrl', false);
              return false;
            }
          }
          // If virtual TAB is active
          if (modifierState.tab) {
            sendTermInput('\t');
            setModifier('tab', false);
            return false;
          }
        }
        return true;
      });

      term.onData(data => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'input', data: data }));
      });
    }

    function sendTermInput(str) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', data: str }));
      }
    }

    function notifyResize() {
      if (!term || !fitAddon) return;
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows
        }));
      }
    }

    // Modifier Key Latching
    function setModifier(mod, val) {
      modifierState[mod] = val;
      if (mod === 'ctrl') btnModCtrl.classList.toggle('latched', val);
      if (mod === 'shift') btnModShift.classList.toggle('latched', val);
      if (mod === 'tab') btnModTab.classList.toggle('latched', val);
    }

    btnModCtrl.addEventListener('click', () => setModifier('ctrl', !modifierState.ctrl));
    btnModShift.addEventListener('click', () => setModifier('shift', !modifierState.shift));
    btnModTab.addEventListener('click', () => {
      sendTermInput('\t');
      setModifier('tab', false);
    });

    // Hardware Keyboard combination for Chat Textarea as well
    chatInput.addEventListener('keydown', (e) => {
      if (modifierState.ctrl) {
        const k = e.key.toLowerCase();
        if (k === 'c') {
          e.preventDefault();
          sendTermInput('\x03');
          chatInput.value = '';
          setModifier('ctrl', false);
          return;
        }
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // WebSocket Management
    let reconnectTimer = null;
    let pingInterval = null;
    let isReconnecting = false;

    function connectWS(conversationId = null) {
      if (!authToken) return;

      if (conversationId !== null && conversationId !== currentConvId) {
        currentConvId = conversationId;
        if (term) term.clear();
      }

      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (pingInterval) clearInterval(pingInterval);

      if (ws) {
        ws.onclose = null;
        ws.onerror = null;
        try { ws.close(); } catch(e) {}
      }

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      let url = (location.port === '8080')
        ? `${proto}//${location.hostname}:8081?token=${authToken}`
        : `${proto}//${location.host}/ws?token=${authToken}`;

      if (currentConvId) url += `&conversation=${currentConvId}`;

      ws = new WebSocket(url);

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'ONLINE';
        isReconnecting = false;
        notifyResize();

        pingInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'ping' }));
          }
        }, 10000);
      };

      let buffer = '';
      let timer = null;

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'output' || msg.type === 'history') {
            buffer += msg.data;
            if (!timer) {
              timer = setTimeout(() => {
                term.write(buffer);
                buffer = '';
                timer = null;
              }, 16);
            }
          }
        } catch (e) {
          term.write(event.data);
        }
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'RECONNECTING...';
        if (pingInterval) clearInterval(pingInterval);

        if (!isReconnecting) {
          isReconnecting = true;
          reconnectTimer = setTimeout(() => connectWS(currentConvId), 1500);
        }
      };

      ws.onerror = () => {
        try { ws.close(); } catch(e) {}
      };
    }

    // Input & Multi-File Upload
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + 'px';
    });

    function handleSend() {
      const val = chatInput.value;
      if (!val && val !== '') return;
      sendTermInput(val + '\r');
      chatInput.value = '';
      chatInput.style.height = '28px';
      attachedFiles = [];
      renderAttachedChips();
      term.scrollToBottom();
    }

    btnSend.addEventListener('click', (e) => {
      e.preventDefault();
      handleSend();
    });

    // Multi-select File Picker
    btnPlus.addEventListener('click', (e) => {
      e.preventDefault();
      filePicker.click();
    });

    filePicker.addEventListener('change', async () => {
      if (!filePicker.files || filePicker.files.length === 0) return;
      const formData = new FormData();
      for (const file of filePicker.files) {
        formData.append('files', file);
      }

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success && data.files.length > 0) {
          for (const f of data.files) {
            attachedFiles.push(f);
          }
          renderAttachedChips();
          // Prepend files to chat input
          const filePaths = attachedFiles.join(' ');
          chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + filePaths;
          chatInput.focus();
        }
      } catch (err) {
        alert('File upload failed');
      }
      filePicker.value = '';
    });

    function renderAttachedChips() {
      attachedChipsRow.innerHTML = '';
      attachedFiles.forEach((f, idx) => {
        const name = f.split('/').pop();
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `<span>📎 ${name}</span><span class="file-chip-remove" onclick="removeAttachedFile(${idx})">×</span>`;
        attachedChipsRow.appendChild(chip);
      });
    }

    window.removeAttachedFile = function(idx) {
      attachedFiles.splice(idx, 1);
      renderAttachedChips();
    };

    // Voice / Microphone Audio Pipeline
    btnMic.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('file', audioBlob, `voice_note_${Date.now()}.webm`);

            try {
              const res = await fetch('/upload-audio', { method: 'POST', body: formData });
              const data = await res.json();
              if (data.success && data.files.length > 0) {
                const audioPath = data.files[0];
                chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + `[Voice Audio: ${audioPath}]`;
                chatInput.focus();
              }
            } catch(e) {
              alert('Voice upload failed');
            }
          };

          mediaRecorder.start();
          isRecording = true;
          btnMic.classList.add('recording');
        } catch(err) {
          alert('Microphone access denied or unsupported');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        isRecording = false;
        btnMic.classList.remove('recording');
      }
    });

    // Directional & Virtual Keys
    document.getElementById('btn-arrow-up').addEventListener('click', (e) => { e.preventDefault(); sendTermInput('\x1b[A'); });
    document.getElementById('btn-arrow-down').addEventListener('click', (e) => { e.preventDefault(); sendTermInput('\x1b[B'); });
    document.getElementById('btn-left').addEventListener('click', (e) => { e.preventDefault(); sendTermInput('\x1b[D'); });
    document.getElementById('btn-right').addEventListener('click', (e) => { e.preventDefault(); sendTermInput('\x1b[C'); });
    document.getElementById('btn-esc').addEventListener('click', (e) => { e.preventDefault(); sendTermInput('\x1b'); });
    document.getElementById('btn-clear').addEventListener('click', (e) => { e.preventDefault(); sendTermInput('\x0c'); chatInput.value = ''; });

    // 1-Tap Quick Action Bar 2.0 Triggers
    document.getElementById('q-goal').addEventListener('click', () => {
      chatInput.value = '/goal ';
      chatInput.focus();
    });

    document.getElementById('q-swarm').addEventListener('click', () => {
      sendTermInput('/teamwork-preview\r');
    });

    document.getElementById('q-research').addEventListener('click', () => {
      chatInput.value = '/boost ';
      chatInput.focus();
    });

    document.getElementById('q-sandbox').addEventListener('click', () => {
      chatInput.value = '/learn ';
      chatInput.focus();
    });

    document.getElementById('q-compact').addEventListener('click', () => {
      sendTermInput('/compact\r');
    });

    document.getElementById('q-halt').addEventListener('click', () => {
      sendTermInput('\x03');
    });

    // Agent Directory & Telemetry Popover
    document.getElementById('q-agents').addEventListener('click', async () => {
      telemetryModal.classList.add('open');
      try {
        const res = await fetch(`/api/telemetry?token=${authToken}`);
        const data = await res.json();
        telemetryContent.innerHTML = `
          <div style="font-size:11px;color:#94a3b8;margin-bottom:6px;">Status: <b style="color:var(--neon-green)">${data.status}</b> • Active PTY Sessions: <b>${data.active_pty_sessions}</b></div>
        `;
        data.agents.forEach(ag => {
          const row = document.createElement('div');
          row.className = 'agent-row';
          row.innerHTML = `
            <div>
              <div style="font-weight:700;color:#f1f5f9;">${ag.name}</div>
              <div style="font-size:10px;color:#94a3b8;">${ag.role}</div>
            </div>
            <span style="font-size:10px;font-weight:800;color:${ag.status==='ACTIVE'?'var(--neon-green)':'#94a3b8'};">${ag.status}</span>
          `;
          telemetryContent.appendChild(row);
        });
      } catch(e) {
        telemetryContent.innerHTML = '<div style="color:#ef4444;font-size:12px;">Failed to load telemetry</div>';
      }
    });

    btnCloseTelemetry.addEventListener('click', () => telemetryModal.classList.remove('open'));

    // Live Execution Flowchart Sidebar
    btnToggleFlowchart.addEventListener('click', () => {
      flowchartSidebar.classList.toggle('open');
      fetchFlowchart();
    });

    btnCloseFlowchart.addEventListener('click', () => flowchartSidebar.classList.remove('open'));

    async function fetchFlowchart() {
      try {
        let url = `/api/flowchart?token=${authToken}`;
        if (currentConvId) url += `&conversation=${currentConvId}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.nodes || data.nodes.length === 0) {
          flowchartContainer.innerHTML = '<div style="color:#64748b;font-size:11px;padding:12px;">No active execution nodes</div>';
          return;
        }

        flowchartContainer.innerHTML = '';
        data.nodes.forEach(node => {
          const div = document.createElement('div');
          div.className = 'flow-node';

          let badgeClass = 'badge-step';
          if (node.type === 'USER_INTENT') badgeClass = 'badge-intent';
          if (node.type === 'TOOL_CALL') badgeClass = 'badge-tool';

          div.innerHTML = `
            <span class="flow-node-badge ${badgeClass}">${node.type}</span>
            <div class="flow-node-label">${node.label}</div>
            ${node.details ? `<div class="flow-node-details">${node.details}</div>` : ''}
          `;
          flowchartContainer.appendChild(div);
        });
      } catch(e) {}
    }

    function startFlowchartPolling() {
      setInterval(fetchFlowchart, 4000);
    }

    // Sessions Drawer with Exact YYYY-MM-DD HH:mm + Relative Time + Category Badges
    function formatRelativeTime(epochSec) {
      const diffSec = Math.floor((Date.now() - epochSec * 1000) / 1000);
      if (diffSec < 60) return 'just now';
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
      return `${Math.floor(diffSec / 86400)}d ago`;
    }

    async function loadConversations() {
      try {
        const res = await fetch(`/api/conversations?token=${authToken}`);
        const list = await res.json();
        if (!list || list.length === 0) {
          convList.innerHTML = '<div style="color:#64748b;padding:10px;font-size:12px;">No sessions recorded</div>';
          return;
        }
        convList.innerHTML = '';
        list.forEach(c => {
          const item = document.createElement('div');
          item.className = 'conv-item' + (currentConvId === c.id ? ' active' : '');

          const relTime = formatRelativeTime(c.mtime);
          const exactTime = c.formatted_time || new Date(c.mtime * 1000).toLocaleString();
          const cat = c.category || 'CLI';

          item.innerHTML = `
            <div class="conv-item-top">
              <span class="conv-category-tag tag-${cat}">[${cat}]</span>
              <div class="conv-title">${c.title}</div>
            </div>
            <div class="conv-time-meta">
              <span title="${exactTime}">${relTime}</span>
              <span>${exactTime}</span>
            </div>
          `;
          item.addEventListener('click', () => {
            closeMenu();
            headerTitle.textContent = '// ' + c.id.substring(0, 8);
            chatInput.value = '';
            connectWS(c.id);
            fetchFlowchart();
          });
          convList.appendChild(item);
        });
      } catch (e) {
        convList.innerHTML = '<div style="color:#f87171;padding:10px;font-size:12px;">Error retrieving logs</div>';
      }
    }

    function openMenu() {
      sidebar.classList.add('open');
      sidebarOverlay.classList.add('open');
      loadConversations();
    }

    function closeMenu() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    }

    btnMenu.addEventListener('click', openMenu);
    sidebarOverlay.addEventListener('click', closeMenu);

    btnNewChat.addEventListener('click', () => {
      closeMenu();
      headerTitle.textContent = '// COCKPIT 2.0';
      chatInput.value = '';
      connectWS(null);
    });

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      adjustViewport();
      setTimeout(adjustViewport, 200);
    });
  </script>
</body>
</html>
